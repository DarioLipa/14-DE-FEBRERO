<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Bienvenida, Mi Amor! ❤️</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@latest/dist/driver.css"/>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="login-body">
    <!-- Aurora Background Orbs -->
    <div class="aurora-bg">
        <div class="aurora-orb aurora-1"></div>
        <div class="aurora-orb aurora-2"></div>
        <div class="aurora-orb aurora-3"></div>
    </div>

    <!-- Floating Actions (Dark Mode Toggle) -->
    <div class="floating-actions-container">
        <button id="toggleDarkMode" class="action-btn" title="Cambiar Tema">
            <i class="ri-sun-line"></i>
        </button>
    </div>

    <!-- Login Glassmorphic Card -->
    <div class="login-card">
        <h1 class="titulo-sesion">¡Bienvenida Amor!</h1>
        <p>Hoy es un día especial. Ingresa nuestra fecha de aniversario para comenzar con esta sorpresa que he preparado para ti. ❤️</p>
        
        <form id="loginForm">
            <div class="login-form-group">
                <label for="anniversaryDate">Fecha de Aniversario</label>
                <input type="date" id="anniversaryDate" class="login-input" required>
            </div>
            
            <button type="submit" class="login-btn">
                <i class="ri-heart-fill"></i> Ingresar
            </button>
        </form>
        
        <p id="errorMessage" class="hidden">
            <strong>¿Fecha incorrecta? 😢</strong><br>
            ¡Inténtalo de nuevo, mi amor! Sé que recuerdas nuestro día.
        </p>
    </div>

    <!-- Driver JS for onboarding tour -->
    <script src="https://unpkg.com/driver.js/dist/driver.js.iife.js"></script>
    <script src="script/script.js"></script>
</body>
</html>
